name = "ai-platform"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "./dist"

[env.production]
NODE_ENV = "production"

[env.production.vars]
API_VERSION = "v1"
DEFAULT_AI_PROVIDER = "openai"
FALLBACK_AI_PROVIDERS = "anthropic,gemini,deepseek"
TASK_EXECUTION_TIMEOUT_MS = "300000"
STALE_RUNNING_MS = "7200000"
MAX_QUEUE_WORKERS = "4"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ai-platform"
database_id = "78720c1e-28b8-407b-b785-45bf79ad67a1"

[[env.production.kv_namespaces]]
binding = "USER_CACHE"
id = "33caaa540e694ae98a5d6d1af1223c7c"

[[env.production.kv_namespaces]]
binding = "RATE_LIMITS"
id = "ac4259535b1f41568f035ae372911cf6"

[[env.production.kv_namespaces]]
binding = "FEATURE_FLAGS"
id = "68d012ba0885488d82cdac793f33543c"
