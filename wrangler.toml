name = "ai-platform"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "./dist"

[vars]
NODE_ENV = "production"
API_VERSION = "v1"
DEFAULT_AI_PROVIDER = "openai"
FALLBACK_AI_PROVIDERS = "anthropic,gemini,deepseek"
TASK_EXECUTION_TIMEOUT_MS = "300000"
STALE_RUNNING_MS = "7200000"
MAX_QUEUE_WORKERS = "4"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ai-platform-db"

# KV Namespaces — id restored from wrangler kv namespace list
[[kv_namespaces]]
binding = "USER_CACHE"
id = "3370d3a1db49404aa2615c706a5e15eb"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "2c2c7dc47eb44448ba93c06f45d3f984"

[[kv_namespaces]]
binding = "FEATURE_FLAGS"
id = "5c4baaf523b74520afb3c04c19d751a6"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "ai-platform-assets"

# Queues
[[queues.producers]]
queue = "ai-tasks"
binding = "AI_TASK_QUEUE"

[[queues.producers]]
queue = "billing-events"
binding = "BILLING_QUEUE"
