name = "ai-platform"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "./dist"

[vars]
NODE_ENV = "production"
API_VERSION = "v1"
DEFAULT_AI_PROVIDER = "openai"
FALLBACK_AI_PROVIDERS = "anthropic,gemini,deepseek"
TASK_EXECUTION_TIMEOUT_MS = "300000"
STALE_RUNNING_MS = "7200000"
MAX_QUEUE_WORKERS = "4"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ai-platform-db"

# KV Namespaces
[[kv_namespaces]]
binding = "USER_CACHE"

[[kv_namespaces]]
binding = "RATE_LIMITS"

[[kv_namespaces]]
binding = "FEATURE_FLAGS"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "ai-platform-assets"

# Queues
[[queues.producers]]
queue = "ai-tasks"
binding = "AI_TASK_QUEUE"

[[queues.producers]]
queue = "billing-events"
binding = "BILLING_QUEUE"
