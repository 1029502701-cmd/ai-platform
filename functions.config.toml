# Cloudflare Pages routing configuration
# This file controls how Pages handles requests.
# Placing in functions/ ensures it's included in the build.

# Global response headers
[response_headers]
  # Always include CORS-friendly headers (frontend and API are on same domain in Pages)
  "/**" = {
    "X-Content-Type-Options" = "nosniff",
    "X-Frame-Options" = "DENY",
    "X-XSS-Protection" = "0",
    "Referrer-Policy" = "strict-origin-when-cross-origin",
  }
