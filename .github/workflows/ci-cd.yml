name: CI/CD

on:
  push:
    branches: [main, master]

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Pages Functions
        run: |
          mkdir -p dist/_fn
          npx wrangler pages functions build functions --outdir dist/_fn

      - name: Deploy Pages (static + functions)
        run: npx wrangler pages deploy dist --project-name ai-companion-frontend --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
